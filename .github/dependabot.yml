version: 2
updates:
  # Frontend (SvelteKit / Tauri JS deps)
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-runtime:
        patterns:
          - "@tauri-apps/*"
          - "@sveltejs/*"
          - "svelte*"
          - "vite"
          - "typescript"

  # Rust shell (Tauri)
  - package-ecosystem: cargo
    directory: /app/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tauri-runtime:
        patterns:
          - "tauri*"

  # GitHub Actions used in CI and release workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
