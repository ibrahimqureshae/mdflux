name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: CI / Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check

  rust-windows:
    name: CI / Rust Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: app/src-tauri
      - run: cargo check --locked
      - run: cargo test --locked

  rust-linux:
    name: CI / Rust Linux
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Tauri Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev javascriptcoregtk-4.1-dev \
            patchelf pkg-config build-essential
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: app/src-tauri
      - run: cargo check --locked
      - run: cargo test --locked

  sidecar-windows:
    name: CI / Sidecar Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app/src-tauri/resources/sidecar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
          cache-dependency-glob: |
            app/src-tauri/resources/sidecar/requirements.lock
            app/src-tauri/resources/sidecar/requirements-ocr.lock
      - name: Install sidecar test dependencies
        shell: pwsh
        run: |
          uv python install 3.12
          uv venv --python 3.12 .venv-ci
          $python = (Resolve-Path .venv-ci/Scripts/python.exe).Path
          uv pip install --python $python --require-hashes -r requirements.lock
          "PYTHON=$python" >> $env:GITHUB_ENV
      - name: Run sidecar tests
        shell: pwsh
        run: '& $env:PYTHON -m unittest discover -s tests -p "test_*.py"'
      - name: Run locked OCR integration tests
        shell: pwsh
        env: { MDFLUX_REQUIRE_OCR_TESTS: "1" }
        run: |
          uv venv --python 3.12 .venv-ocr-ci
          $python = (Resolve-Path .venv-ocr-ci/Scripts/python.exe).Path
          uv pip install --python $python --require-hashes -r requirements-ocr.lock
          & $python -m unittest tests.test_ocr_runtime

  sidecar-linux:
    name: CI / Sidecar Linux
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app/src-tauri/resources/sidecar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
          cache-dependency-glob: |
            app/src-tauri/resources/sidecar/requirements.lock
            app/src-tauri/resources/sidecar/requirements-ocr.lock
      - name: Install sidecar test dependencies
        run: |
          uv python install 3.12
          uv venv --python 3.12 .venv-ci
          PYTHON="$PWD/.venv-ci/bin/python"
          uv pip install --python "$PYTHON" --require-hashes -r requirements.lock
          echo "PYTHON=$PYTHON" >> "$GITHUB_ENV"
      - name: Run sidecar tests
        run: '$PYTHON -m unittest discover -s tests -p "test_*.py"'
      - name: Run locked OCR integration tests
        env: { MDFLUX_REQUIRE_OCR_TESTS: "1" }
        run: |
          uv venv --python 3.12 .venv-ocr-ci
          uv pip install --python .venv-ocr-ci/bin/python --require-hashes -r requirements-ocr.lock
          .venv-ocr-ci/bin/python -m unittest tests.test_ocr_runtime

  dependency-drift:
    name: CI / Dependency Drift
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Run dependency drift check
        run: |
          python tools/dependencies/check.py
          python tools/release/check_workflow_tools.py
