name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: CI / Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check

  rust-windows:
    name: CI / Rust Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: app/src-tauri
      - run: cargo check --locked
      - run: cargo test --locked

  rust-linux:
    name: CI / Rust Linux
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Tauri Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev javascriptcoregtk-4.1-dev \
            patchelf pkg-config build-essential
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: app/src-tauri
      - run: cargo check --locked
      - run: cargo test --locked

  sidecar-windows:
    name: CI / Sidecar Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app/src-tauri/resources/sidecar
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          enable-cache: true
          cache-dependency-glob: app/src-tauri/resources/sidecar/requirements.lock
      - name: Install sidecar test dependencies
        shell: pwsh
        run: |
          uv python install 3.12
          uv venv --python 3.12 .venv-ci
          $python = (Resolve-Path .venv-ci/Scripts/python.exe).Path
          uv pip install --python $python --require-hashes -r requirements.lock
          "PYTHON=$python" >> $env:GITHUB_ENV
      - name: Run sidecar tests
        shell: pwsh
        run: '& $env:PYTHON -m unittest discover -s tests -p "test_*.py"'

  sidecar-linux:
    name: CI / Sidecar Linux
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app/src-tauri/resources/sidecar
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          enable-cache: true
          cache-dependency-glob: app/src-tauri/resources/sidecar/requirements.lock
      - name: Install sidecar test dependencies
        run: |
          uv python install 3.12
          uv venv --python 3.12 .venv-ci
          PYTHON="$PWD/.venv-ci/bin/python"
          uv pip install --python "$PYTHON" --require-hashes -r requirements.lock
          echo "PYTHON=$PYTHON" >> "$GITHUB_ENV"
      - name: Run sidecar tests
        run: '$PYTHON -m unittest discover -s tests -p "test_*.py"'

  dependency-drift:
    name: CI / Dependency Drift
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run dependency drift check
        run: |
          python tools/dependencies/check.py
          python tools/release/check_workflow_tools.py
