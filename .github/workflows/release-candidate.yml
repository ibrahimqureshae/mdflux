name: Release candidate

on:
  pull_request:
    branches: [main]
    types: [labeled]
  workflow_dispatch:
    inputs:
      ref:
        description: Exact 40-character commit SHA to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  validate-ref:
    name: RC / Validate exact source
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'integration') }}
    runs-on: ubuntu-22.04
    outputs:
      commit: ${{ steps.commit.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: commit
        name: Reject non-SHA refs and resolve checkout
        env:
          REQUESTED_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.pull_request.head.sha }}
        run: |
          [[ "$REQUESTED_REF" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "Candidate input must be an exact commit SHA" >&2; exit 1; }
          git cat-file -e "$REQUESTED_REF^{commit}" || { echo "Requested commit does not exist" >&2; exit 1; }
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "${REQUESTED_REF,,}" ]] || { echo "Checkout does not match requested commit" >&2; exit 1; }
          echo "value=$actual" >> "$GITHUB_OUTPUT"

  frontend:
    name: RC / Frontend
    needs: validate-ref
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.validate-ref.outputs.commit }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check

  rust-windows:
    name: RC / Rust Windows
    needs: validate-ref
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.validate-ref.outputs.commit }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: app/src-tauri
      - run: cargo check --locked
      - run: cargo test --locked

  rust-linux:
    name: RC / Rust Linux
    needs: validate-ref
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.validate-ref.outputs.commit }}
      - name: Install Tauri Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev javascriptcoregtk-4.1-dev patchelf pkg-config build-essential
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: app/src-tauri
      - run: cargo check --locked
      - run: cargo test --locked

  sidecar-windows:
    name: RC / Sidecar Windows
    needs: validate-ref
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app/src-tauri/resources/sidecar
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.validate-ref.outputs.commit }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          enable-cache: true
          cache-dependency-glob: |
            app/src-tauri/resources/sidecar/requirements.lock
            app/src-tauri/resources/sidecar/requirements-ocr.lock
      - name: Install and test sidecar
        shell: pwsh
        run: |
          uv python install 3.12
          uv venv --python 3.12 .venv-ci
          $python = (Resolve-Path .venv-ci/Scripts/python.exe).Path
          uv pip install --python $python --require-hashes -r requirements.lock
          & $python -m unittest discover -s tests -p "test_*.py"
          uv venv --python 3.12 .venv-ocr-ci
          $ocrPython = (Resolve-Path .venv-ocr-ci/Scripts/python.exe).Path
          uv pip install --python $ocrPython --require-hashes -r requirements-ocr.lock
          $env:MDFLUX_REQUIRE_OCR_TESTS = "1"
          & $ocrPython -m unittest tests.test_ocr_runtime

  sidecar-linux:
    name: RC / Sidecar Linux
    needs: validate-ref
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app/src-tauri/resources/sidecar
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.validate-ref.outputs.commit }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          enable-cache: true
          cache-dependency-glob: |
            app/src-tauri/resources/sidecar/requirements.lock
            app/src-tauri/resources/sidecar/requirements-ocr.lock
      - name: Install and test sidecar
        run: |
          uv python install 3.12
          uv venv --python 3.12 .venv-ci
          PYTHON="$PWD/.venv-ci/bin/python"
          uv pip install --python "$PYTHON" --require-hashes -r requirements.lock
          "$PYTHON" -m unittest discover -s tests -p "test_*.py"
          uv venv --python 3.12 .venv-ocr-ci
          uv pip install --python .venv-ocr-ci/bin/python --require-hashes -r requirements-ocr.lock
          MDFLUX_REQUIRE_OCR_TESTS=1 .venv-ocr-ci/bin/python -m unittest tests.test_ocr_runtime

  dependency-drift:
    name: RC / Dependency Drift
    needs: validate-ref
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.validate-ref.outputs.commit }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python tools/dependencies/check.py
      - run: python tools/release/check_workflow_tools.py

  build-windows-lite:
    name: RC / Build Windows Lite
    needs: [validate-ref, frontend, rust-windows, rust-linux, sidecar-windows, sidecar-linux, dependency-drift]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.validate-ref.outputs.commit }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 20, cache: npm, cache-dependency-path: app/package-lock.json }
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with: { workspaces: app/src-tauri }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - id: version
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $version = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "value=$version" >> $env:GITHUB_OUTPUT
          git rev-parse HEAD > dist/source-commit.txt
      - name: Build and verify archive
        shell: pwsh
        run: |
          pwsh -File scripts/make-portable.ps1
          $archive = "dist/MDFlux_${{ steps.version.outputs.value }}_windows_x64_lite.zip"
          if (-not (Test-Path -LiteralPath $archive)) { throw "Expected archive not found: $archive" }
          uv venv --python 3.12 .venv-verifier
          $verifierPython = (Resolve-Path .venv-verifier/Scripts/python.exe).Path
          uv pip install --python $verifierPython --require-hashes -r app/src-tauri/resources/sidecar/requirements-full.lock
          $output = & $verifierPython -m tools.release --archive "$archive" --platform windows-x64 --edition lite --json-out dist/verification-windows-x64-lite.json 2>&1
          $status = $LASTEXITCODE
          $output | Tee-Object -FilePath dist/verification-windows-x64-lite.txt
          if ($status -ne 0) { exit $status }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: windows-x64-lite
          path: |
            dist/MDFlux_*_windows_x64_lite.zip
            dist/source-commit.txt
            dist/verification-windows-x64-lite.json
            dist/verification-windows-x64-lite.txt
          if-no-files-found: warn

  build-windows-full:
    name: RC / Build Windows Full
    needs: [validate-ref, frontend, rust-windows, rust-linux, sidecar-windows, sidecar-linux, dependency-drift]
    runs-on: windows-latest
    env: { UV_LINK_MODE: copy }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ needs.validate-ref.outputs.commit }}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 20, cache: npm, cache-dependency-path: app/package-lock.json }
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with: { workspaces: app/src-tauri }
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: "3.12" }
      - id: version
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $version = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "value=$version" >> $env:GITHUB_OUTPUT
          git rev-parse HEAD > dist/source-commit.txt
          uv python install 3.12
          pwsh -File scripts/make-portable-full.ps1
      - name: Verify Windows Full archive
        shell: pwsh
        run: |
          $archive = "dist/MDFlux_${{ steps.version.outputs.value }}_windows_x64_full.zip"
          if (-not (Test-Path -LiteralPath $archive)) { throw "Expected archive not found: $archive" }
          $output = python -m tools.release --archive "$archive" --platform windows-x64 --edition full --json-out dist/verification-windows-x64-full.json 2>&1
          $status = $LASTEXITCODE
          $output | Tee-Object -FilePath dist/verification-windows-x64-full.txt
          if ($status -ne 0) { exit $status }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: windows-x64-full
          path: |
            dist/MDFlux_*_windows_x64_full.zip
            dist/source-commit.txt
            dist/verification-windows-x64-full.json
            dist/verification-windows-x64-full.txt
          if-no-files-found: warn

  build-linux-lite:
    name: RC / Build Linux Lite
    needs: [validate-ref, frontend, rust-windows, rust-linux, sidecar-windows, sidecar-linux, dependency-drift]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ needs.validate-ref.outputs.commit }}"
      - name: Install Linux build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev javascriptcoregtk-4.1-dev patchelf pkg-config build-essential
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 20, cache: npm, cache-dependency-path: app/package-lock.json }
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with: { workspaces: app/src-tauri }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - id: version
        run: |
          mkdir -p dist
          VERSION="$(python -c "import json; print(json.load(open('app/src-tauri/tauri.conf.json'))['version'])")"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > dist/source-commit.txt
          bash scripts/make-portable-linux.sh
      - name: Verify Linux Lite archive
        run: |
          ARCHIVE="dist/MDFlux_${{ steps.version.outputs.value }}_linux_x64_glibc_lite.tar.gz"
          test -f "$ARCHIVE"
          uv venv --python 3.12 .venv-verifier
          uv pip install --python .venv-verifier/bin/python --require-hashes -r app/src-tauri/resources/sidecar/requirements-full.lock
          set +e
          .venv-verifier/bin/python -m tools.release --archive "$ARCHIVE" --platform linux-x64-glibc --edition lite --json-out dist/verification-linux-x64-glibc-lite.json 2>&1 | tee dist/verification-linux-x64-glibc-lite.txt
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: linux-x64-glibc-lite
          path: |
            dist/MDFlux_*_linux_x64_glibc_lite.tar.gz
            dist/source-commit.txt
            dist/verification-linux-x64-glibc-lite.json
            dist/verification-linux-x64-glibc-lite.txt
          if-no-files-found: warn

  build-linux-full:
    name: RC / Build Linux Full
    needs: [validate-ref, frontend, rust-windows, rust-linux, sidecar-windows, sidecar-linux, dependency-drift]
    runs-on: ubuntu-22.04
    env: { UV_LINK_MODE: copy }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ needs.validate-ref.outputs.commit }}"
      - name: Install Linux build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev javascriptcoregtk-4.1-dev patchelf pkg-config build-essential
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 20, cache: npm, cache-dependency-path: app/package-lock.json }
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with: { workspaces: app/src-tauri }
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: "3.12" }
      - id: version
        run: |
          mkdir -p dist
          VERSION="$(python -c "import json; print(json.load(open('app/src-tauri/tauri.conf.json'))['version'])")"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > dist/source-commit.txt
          uv python install 3.12
          bash scripts/make-portable-linux-full.sh
      - name: Verify Linux Full archive
        run: |
          ARCHIVE="dist/MDFlux_${{ steps.version.outputs.value }}_linux_x64_glibc_full.tar.gz"
          test -f "$ARCHIVE"
          set +e
          python -m tools.release --archive "$ARCHIVE" --platform linux-x64-glibc --edition full --json-out dist/verification-linux-x64-glibc-full.json 2>&1 | tee dist/verification-linux-x64-glibc-full.txt
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: linux-x64-glibc-full
          path: |
            dist/MDFlux_*_linux_x64_glibc_full.tar.gz
            dist/source-commit.txt
            dist/verification-linux-x64-glibc-full.json
            dist/verification-linux-x64-glibc-full.txt
          if-no-files-found: warn

  aggregate:
    name: RC / Aggregate four artifacts
    needs: [validate-ref, build-windows-lite, build-windows-full, build-linux-lite, build-linux-full]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ needs.validate-ref.outputs.commit }}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { path: candidate, pattern: "*", merge-multiple: true }
      - name: Assert four archives and one resolved commit
        env:
          EXPECTED_COMMIT: "${{ needs.validate-ref.outputs.commit }}"
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path('candidate')
          expected = {
              'MDFlux_0.3.0_windows_x64_lite.zip', 'MDFlux_0.3.0_windows_x64_full.zip',
              'MDFlux_0.3.0_linux_x64_glibc_lite.tar.gz', 'MDFlux_0.3.0_linux_x64_glibc_full.tar.gz'}
          archives = {p.name for p in root.glob('MDFlux_*')}
          if archives != expected: raise SystemExit(f'archive set mismatch: {archives}')
          commits = {p.read_text().strip() for p in root.glob('source-commit.txt')}
          if commits != {os.environ['EXPECTED_COMMIT']}: raise SystemExit(f'commit mismatch: {commits}')
          if len(list(root.glob('verification-*.json'))) != 4 or len(list(root.glob('verification-*.txt'))) != 4:
              raise SystemExit('expected four JSON and four text verification reports')
          PY
      - name: Write checksums and candidate manifest
        env:
          EXPECTED_COMMIT: "${{ needs.validate-ref.outputs.commit }}"
        run: |
          mkdir -p candidate/release-candidate
          find candidate -maxdepth 1 -type f \( -name 'MDFlux_*' -o -name 'verification-*.json' -o -name 'verification-*.txt' \) -print0 | sort -z | xargs -0 sha256sum > candidate/release-candidate/SHA256SUMS
          EXPECTED_COMMIT="$EXPECTED_COMMIT" python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          root = Path('candidate')
          archives = sorted(p.name for p in root.glob('MDFlux_*'))
          manifest = {'schema': 1, 'kind': 'release-candidate', 'app_version': '0.3.0', 'commit': os.environ['EXPECTED_COMMIT'], 'built_at_utc': datetime.now(timezone.utc).replace(microsecond=0).isoformat(), 'archives': archives, 'platforms': ['windows-x64', 'linux-x64-glibc'], 'editions': ['lite', 'full']}
          (root / 'release-candidate' / 'release-candidate.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
          cp candidate/MDFlux_* candidate/release-candidate/
          cp candidate/verification-*.json candidate/verification-*.txt candidate/release-candidate/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-candidate-bundle
          path: candidate/release-candidate
          if-no-files-found: error

  attest:
    name: RC / Attest artifacts
    needs: aggregate
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: release-candidate-bundle, path: candidate }
      - uses: actions/attest-build-provenance@9d57eef8c06cd9d6b433effeeb7a6a77b3ff94ad
        with:
          subject-path: candidate/MDFlux_*
