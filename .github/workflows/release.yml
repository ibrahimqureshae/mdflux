name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing protected vX.Y.Z tag to rebuild
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Release / Validate protected tag
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          fetch-depth: 0
      - id: resolve
        name: Validate tag and checkout consistency
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          EVENT_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Release requires a semantic vX.Y.Z tag" >&2; exit 1; }
          tag_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          checkout_commit="$(git rev-parse HEAD)"
          [[ "$tag_commit" == "$checkout_commit" ]] || { echo "Tag and checkout commit differ" >&2; exit 1; }
          app_version="$(python -c "import json; print(json.load(open('app/src-tauri/tauri.conf.json'))['version'])")"
          [[ "$RELEASE_TAG" == "v$app_version" ]] || { echo "Release tag and checked-out application version differ" >&2; exit 1; }
          if [[ -n "$EVENT_SHA" && "${EVENT_SHA,,}" != "$tag_commit" ]]; then
            echo "Tag push event SHA does not match tag target" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$checkout_commit" >> "$GITHUB_OUTPUT"

  frontend:
    name: Release / Frontend
    needs: validate-tag
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ needs.validate-tag.outputs.commit }}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 20, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run check

  rust-windows:
    name: Release / Rust Windows
    needs: validate-tag
    runs-on: windows-latest
    defaults: { run: { working-directory: app/src-tauri } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ needs.validate-tag.outputs.commit }}"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with: { workspaces: app/src-tauri }
      - run: cargo check --locked
      - run: cargo test --locked

  rust-linux:
    name: Release / Rust Linux
    needs: validate-tag
    runs-on: ubuntu-22.04
    defaults: { run: { working-directory: app/src-tauri } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ needs.validate-tag.outputs.commit }}"
      - name: Install Linux build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev javascriptcoregtk-4.1-dev patchelf pkg-config build-essential
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with: { workspaces: app/src-tauri }
      - run: cargo check --locked
      - run: cargo test --locked

  sidecar-windows:
    name: Release / Sidecar Windows
    needs: validate-tag
    runs-on: windows-latest
    defaults: { run: { working-directory: app/src-tauri/resources/sidecar } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ needs.validate-tag.outputs.commit }}"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          enable-cache: true
          cache-dependency-glob: |
            app/src-tauri/resources/sidecar/requirements.lock
            app/src-tauri/resources/sidecar/requirements-ocr.lock
      - name: Install and test sidecar
        shell: pwsh
        run: |
          uv python install 3.12
          uv venv --python 3.12 .venv-ci
          $python = (Resolve-Path .venv-ci/Scripts/python.exe).Path
          uv pip install --python $python --require-hashes -r requirements.lock
          & $python -m unittest discover -s tests -p "test_*.py"
          uv venv --python 3.12 .venv-ocr-ci
          $ocrPython = (Resolve-Path .venv-ocr-ci/Scripts/python.exe).Path
          uv pip install --python $ocrPython --require-hashes -r requirements-ocr.lock
          $env:MDFLUX_REQUIRE_OCR_TESTS = "1"
          & $ocrPython -m unittest tests.test_ocr_runtime

  sidecar-linux:
    name: Release / Sidecar Linux
    needs: validate-tag
    runs-on: ubuntu-22.04
    defaults: { run: { working-directory: app/src-tauri/resources/sidecar } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ needs.validate-tag.outputs.commit }}"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          enable-cache: true
          cache-dependency-glob: |
            app/src-tauri/resources/sidecar/requirements.lock
            app/src-tauri/resources/sidecar/requirements-ocr.lock
      - name: Install and test sidecar
        run: |
          uv python install 3.12
          uv venv --python 3.12 .venv-ci
          PYTHON="$PWD/.venv-ci/bin/python"
          uv pip install --python "$PYTHON" --require-hashes -r requirements.lock
          "$PYTHON" -m unittest discover -s tests -p "test_*.py"
          uv venv --python 3.12 .venv-ocr-ci
          uv pip install --python .venv-ocr-ci/bin/python --require-hashes -r requirements-ocr.lock
          MDFLUX_REQUIRE_OCR_TESTS=1 .venv-ocr-ci/bin/python -m unittest tests.test_ocr_runtime

  dependency-drift:
    name: Release / Dependency Drift
    needs: validate-tag
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ needs.validate-tag.outputs.commit }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: "3.12" }
      - run: python tools/dependencies/check.py
      - run: python tools/release/check_workflow_tools.py

  build-windows-lite:
    name: Release / Build Windows Lite
    needs: [validate-tag, frontend, rust-windows, rust-linux, sidecar-windows, sidecar-linux, dependency-drift]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ needs.validate-tag.outputs.commit }}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 20, cache: npm, cache-dependency-path: app/package-lock.json }
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with: { workspaces: app/src-tauri }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - id: version
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $version = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "value=$version" >> $env:GITHUB_OUTPUT
          git rev-parse HEAD > dist/source-commit.txt
          pwsh -File scripts/make-portable.ps1
      - name: Verify Windows Lite archive
        shell: pwsh
        run: |
          $archive = "dist/MDFlux_${{ steps.version.outputs.value }}_windows_x64_lite.zip"
          if (-not (Test-Path -LiteralPath $archive)) { throw "Expected archive not found: $archive" }
          uv venv --python 3.12 .venv-verifier
          $verifierPython = (Resolve-Path .venv-verifier/Scripts/python.exe).Path
          uv pip install --python $verifierPython --require-hashes -r app/src-tauri/resources/sidecar/requirements-full.lock
          $output = & $verifierPython -m tools.release --archive "$archive" --platform windows-x64 --edition lite --json-out dist/verification-windows-x64-lite.json 2>&1
          $status = $LASTEXITCODE
          $output | Tee-Object -FilePath dist/verification-windows-x64-lite.txt
          if ($status -ne 0) { exit $status }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: windows-x64-lite
          path: |
            dist/MDFlux_*_windows_x64_lite.zip
            dist/source-commit.txt
            dist/verification-windows-x64-lite.json
            dist/verification-windows-x64-lite.txt
          if-no-files-found: warn

  build-windows-full:
    name: Release / Build Windows Full
    needs: [validate-tag, frontend, rust-windows, rust-linux, sidecar-windows, sidecar-linux, dependency-drift]
    runs-on: windows-latest
    env: { UV_LINK_MODE: copy }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ needs.validate-tag.outputs.commit }}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 20, cache: npm, cache-dependency-path: app/package-lock.json }
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with: { workspaces: app/src-tauri }
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: "3.12" }
      - id: version
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $version = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "value=$version" >> $env:GITHUB_OUTPUT
          git rev-parse HEAD > dist/source-commit.txt
          uv python install 3.12
          pwsh -File scripts/make-portable-full.ps1
      - name: Verify Windows Full archive
        shell: pwsh
        run: |
          $archive = "dist/MDFlux_${{ steps.version.outputs.value }}_windows_x64_full.zip"
          if (-not (Test-Path -LiteralPath $archive)) { throw "Expected archive not found: $archive" }
          $output = python -m tools.release --archive "$archive" --platform windows-x64 --edition full --json-out dist/verification-windows-x64-full.json 2>&1
          $status = $LASTEXITCODE
          $output | Tee-Object -FilePath dist/verification-windows-x64-full.txt
          if ($status -ne 0) { exit $status }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: windows-x64-full
          path: |
            dist/MDFlux_*_windows_x64_full.zip
            dist/source-commit.txt
            dist/verification-windows-x64-full.json
            dist/verification-windows-x64-full.txt
          if-no-files-found: warn

  build-linux-lite:
    name: Release / Build Linux Lite
    needs: [validate-tag, frontend, rust-windows, rust-linux, sidecar-windows, sidecar-linux, dependency-drift]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ needs.validate-tag.outputs.commit }}"
      - name: Install Linux build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev javascriptcoregtk-4.1-dev patchelf pkg-config build-essential
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 20, cache: npm, cache-dependency-path: app/package-lock.json }
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with: { workspaces: app/src-tauri }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - id: version
        run: |
          mkdir -p dist
          VERSION="$(python -c "import json; print(json.load(open('app/src-tauri/tauri.conf.json'))['version'])")"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > dist/source-commit.txt
          bash scripts/make-portable-linux.sh
      - name: Verify Linux Lite archive
        run: |
          ARCHIVE="dist/MDFlux_${{ steps.version.outputs.value }}_linux_x64_glibc_lite.tar.gz"
          test -f "$ARCHIVE"
          uv venv --python 3.12 .venv-verifier
          uv pip install --python .venv-verifier/bin/python --require-hashes -r app/src-tauri/resources/sidecar/requirements-full.lock
          set +e
          .venv-verifier/bin/python -m tools.release --archive "$ARCHIVE" --platform linux-x64-glibc --edition lite --json-out dist/verification-linux-x64-glibc-lite.json 2>&1 | tee dist/verification-linux-x64-glibc-lite.txt
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: linux-x64-glibc-lite
          path: |
            dist/MDFlux_*_linux_x64_glibc_lite.tar.gz
            dist/source-commit.txt
            dist/verification-linux-x64-glibc-lite.json
            dist/verification-linux-x64-glibc-lite.txt
          if-no-files-found: warn

  build-linux-full:
    name: Release / Build Linux Full
    needs: [validate-tag, frontend, rust-windows, rust-linux, sidecar-windows, sidecar-linux, dependency-drift]
    runs-on: ubuntu-22.04
    env: { UV_LINK_MODE: copy }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ needs.validate-tag.outputs.commit }}"
      - name: Install Linux build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev javascriptcoregtk-4.1-dev patchelf pkg-config build-essential
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 20, cache: npm, cache-dependency-path: app/package-lock.json }
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with: { workspaces: app/src-tauri }
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: "3.12" }
      - id: version
        run: |
          mkdir -p dist
          VERSION="$(python -c "import json; print(json.load(open('app/src-tauri/tauri.conf.json'))['version'])")"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > dist/source-commit.txt
          uv python install 3.12
          bash scripts/make-portable-linux-full.sh
      - name: Verify Linux Full archive
        run: |
          ARCHIVE="dist/MDFlux_${{ steps.version.outputs.value }}_linux_x64_glibc_full.tar.gz"
          test -f "$ARCHIVE"
          set +e
          python -m tools.release --archive "$ARCHIVE" --platform linux-x64-glibc --edition full --json-out dist/verification-linux-x64-glibc-full.json 2>&1 | tee dist/verification-linux-x64-glibc-full.txt
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: linux-x64-glibc-full
          path: |
            dist/MDFlux_*_linux_x64_glibc_full.tar.gz
            dist/source-commit.txt
            dist/verification-linux-x64-glibc-full.json
            dist/verification-linux-x64-glibc-full.txt
          if-no-files-found: warn

  aggregate:
    name: Release / Aggregate four artifacts
    needs: [validate-tag, build-windows-lite, build-windows-full, build-linux-lite, build-linux-full]
    runs-on: ubuntu-22.04
    outputs:
      bundle: ${{ steps.bundle.outputs.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ needs.validate-tag.outputs.commit }}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { path: release-assets, pattern: "*", merge-multiple: true }
      - name: Assert tag, commit, reports, and exactly four archives
        env:
          EXPECTED_COMMIT: ${{ needs.validate-tag.outputs.commit }}
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          python - <<'PY'
          import os, json
          from pathlib import Path
          root = Path('release-assets')
          expected = {'MDFlux_0.3.0_windows_x64_lite.zip', 'MDFlux_0.3.0_windows_x64_full.zip', 'MDFlux_0.3.0_linux_x64_glibc_lite.tar.gz', 'MDFlux_0.3.0_linux_x64_glibc_full.tar.gz'}
          archives = {p.name for p in root.glob('MDFlux_*')}
          if archives != expected: raise SystemExit(f'archive set mismatch: {archives}')
          commits = {p.read_text().strip() for p in root.glob('source-commit.txt')}
          if commits != {os.environ['EXPECTED_COMMIT']}: raise SystemExit(f'commit mismatch: {commits}')
          if len(list(root.glob('verification-*.json'))) != 4 or len(list(root.glob('verification-*.txt'))) != 4: raise SystemExit('four verification report pairs required')
          if not os.environ['RELEASE_TAG'].startswith('v'): raise SystemExit('invalid release tag')
          PY
      - id: bundle
        name: Write checksums and release manifest
        env:
          EXPECTED_COMMIT: "${{ needs.validate-tag.outputs.commit }}"
          RELEASE_TAG: "${{ needs.validate-tag.outputs.tag }}"
        run: |
          mkdir -p release-assets/manifest
          find release-assets -maxdepth 1 -type f \( -name 'MDFlux_*' -o -name 'verification-*.json' -o -name 'verification-*.txt' \) -print0 | sort -z | xargs -0 sha256sum > release-assets/manifest/SHA256SUMS
          EXPECTED_COMMIT="$EXPECTED_COMMIT" RELEASE_TAG="$RELEASE_TAG" python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          root = Path('release-assets')
          archives = sorted(p.name for p in root.glob('MDFlux_*'))
          manifest = {'schema': 1, 'kind': 'release', 'app_version': '0.3.0', 'commit': os.environ['EXPECTED_COMMIT'], 'tag': os.environ['RELEASE_TAG'], 'built_at_utc': datetime.now(timezone.utc).replace(microsecond=0).isoformat(), 'archives': archives, 'platforms': ['windows-x64', 'linux-x64-glibc'], 'editions': ['lite', 'full']}
          (root / 'manifest' / 'release-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
          cp release-assets/MDFlux_* release-assets/manifest/
          cp release-assets/verification-*.json release-assets/verification-*.txt release-assets/manifest/
          echo "name=release-assets" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-bundle
          path: release-assets/manifest
          if-no-files-found: error

  attest:
    name: Release / Attest artifacts
    needs: aggregate
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: release-bundle, path: release-assets }
      - uses: actions/attest-build-provenance@9d57eef8c06cd9d6b433effeeb7a6a77b3ff94ad
        with:
          subject-path: release-assets/MDFlux_*

  publish:
    name: Release / Create protected draft
    needs: [validate-tag, aggregate, attest]
    runs-on: ubuntu-22.04
    environment: production-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ needs.validate-tag.outputs.commit }}"
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: release-bundle, path: release-assets }
      - name: Revalidate tag, checkout, and manifest before publication
        env:
          EXPECTED_COMMIT: "${{ needs.validate-tag.outputs.commit }}"
          RELEASE_TAG: "${{ needs.validate-tag.outputs.tag }}"
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$EXPECTED_COMMIT"
          EXPECTED_COMMIT="$EXPECTED_COMMIT" RELEASE_TAG="$RELEASE_TAG" python - <<'PY'
          import json, os
          m = json.load(open('release-assets/release-manifest.json', encoding='utf-8'))
          if m.get('commit') != os.environ['EXPECTED_COMMIT'] or m.get('tag') != os.environ['RELEASE_TAG']: raise SystemExit('manifest does not match protected tag and checkout')
          if len(m.get('archives', [])) != 4: raise SystemExit('release manifest must contain exactly four archives')
          PY
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ needs.validate-tag.outputs.tag }}
          name: MDFlux ${{ needs.validate-tag.outputs.tag }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/MDFlux_*
            release-assets/verification-*.json
